<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Background circle with purple gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6D28D9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E9D5FF;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="1024" height="1024" rx="220" ry="220" fill="url(#bgGrad)"/>

  <!-- Scissors - top blade -->
  <g transform="translate(512,512)" fill="url(#iconGrad)">
    <!-- Left scissor ring -->
    <circle cx="-180" cy="-160" r="75" fill="none" stroke="white" stroke-width="52"/>
    <!-- Left scissor blade -->
    <line x1="-130" y1="-115" x2="160" y2="160" stroke="white" stroke-width="52" stroke-linecap="round"/>

    <!-- Right scissor ring -->
    <circle cx="180" cy="-160" r="75" fill="none" stroke="white" stroke-width="52"/>
    <!-- Right scissor blade -->
    <line x1="130" y1="-115" x2="-160" y2="160" stroke="white" stroke-width="52" stroke-linecap="round"/>

    <!-- Center screw/pivot -->
    <circle cx="0" cy="20" r="32" fill="#8B5CF6" stroke="white" stroke-width="20"/>

    <!-- Needle below scissors -->
    <line x1="-10" y1="220" x2="10" y2="420" stroke="white" stroke-width="28" stroke-linecap="round"/>
    <!-- Needle eye -->
    <ellipse cx="0" cy="215" rx="22" ry="14" fill="none" stroke="white" stroke-width="22"/>
    <!-- Thread curve -->
    <path d="M10,300 Q80,320 60,420 Q40,480 120,460" fill="none" stroke="white" stroke-width="18" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>
