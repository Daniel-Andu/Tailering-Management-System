flutter_launcher_icons:
  android: true
  ios: false  # iOS folder doesn't exist - disable for now
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 23
  
  # Android Adaptive Icons (API 26+)
  adaptive_icon_background: "#000000"  # Black background for purple logo
  adaptive_icon_foreground: "assets/images/app_icon.png"
  
  # Web Configuration
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
    background_color: "#000000"
    theme_color: "#6366F1"
  
  # Windows Configuration
  windows:
    generate: true
    image_path: "assets/images/app_icon.png"
    icon_size: 48
